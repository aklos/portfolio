name: "LinkedIn token check"

# Member tokens last 60 days and the self-serve products don't get refresh
# tokens, so this opens an issue before the token lapses rather than letting a
# syndication run be the thing that discovers it.
on:
  schedule:
    - cron: "0 9 * * 1" # Mondays, 09:00 UTC
  workflow_dispatch:

permissions:
  issues: write

jobs:
  check:
    name: "Check token expiry"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - run: pip install -r scripts/requirements.txt

      - id: check
        run: python scripts/linkedin_token_check.py
        env:
          LINKEDIN_CLIENT_ID: ${{ secrets.LINKEDIN_CLIENT_ID }}
          LINKEDIN_CLIENT_SECRET: ${{ secrets.LINKEDIN_CLIENT_SECRET }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}

      # One open issue at a time — a weekly cron would otherwise file one every
      # Monday for the fortnight before expiry.
      - name: "Open an issue"
        if: steps.check.outputs.status != 'ok'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "LinkedIn token needs renewing"
          BODY: ${{ steps.check.outputs.message }}
        run: |
          existing=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number --jq 'length')
          if [ "$existing" -gt 0 ]; then
            echo "Issue already open, nothing to do."
            exit 0
          fi
          gh issue create --title "$TITLE" --body "$BODY

          Run \`python scripts/linkedin_auth.py\` locally — it refreshes \`.env\`
          and updates the repository secrets for you. Close this issue once done."
